<h1>Embedded Carry-Forward</h1>

<pre>const balanced = string => {
  const counts = [...string].reduce((a, e) => {
    a[e] = ++a[e] || 1;
    return a;
  }, {});
  
  const freq = Object.values(counts);
  return !freq.length || freq.every(e => e === freq[0]);
};</pre>
