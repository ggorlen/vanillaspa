  <h2>Embedded Carry-Forward Demo</h2>
  <div id="qualified-embed"></div>
  <button disabled>next challenge</button>
  <div>
    Solution:
<pre>const balanced = string =&gt; {
  const counts = [...string].reduce((a, e) =&gt; {
    a[e] = ++a[e] || 1;
    return a;
  }, {});
  
  const freq = Object.values(counts);
  return !freq.length || freq.every(e =&gt; e === freq[0]);
};</pre>
