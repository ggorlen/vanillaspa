<body>

<script>
var Module = {
  postRun: () => { 
    console.log("DONE") 
  },
  print: (text) => {
    console.log(text)
  },
  printErr: (text) => {
    console.log(text)
  }
};
const data = `
        .data
msg:    .asciiz "Hello World"
.extern foobar 4

        .text
        .globl main
main:   
        li $v0, 4       # syscall 4 (print_str)
        la $a0, msg     # argument: string
        syscall         # print the string
        lw $t1, foobar
        
        jr $ra          # retrun to caller

`;
Module.onRuntimeInitialized = () => { 
  FS.writeFile("input.s", data);
  Module.init();
  const result = Module.step(0, true);
};
WebAssembly.instantiateStreaming(fetch("https://cdn.glitch.com/25dc2310-ccc4-446e-b9dc-baeb5dab1b3d%2Fwasm.wasm?v=1588375883648"))
.then(results => {
  console.log(results);
});
  
</script>
